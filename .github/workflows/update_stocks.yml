name: Update stock prices

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC daily (after US markets close, before Asia/Europe reopen)
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests plotly

      - name: Fetch prices
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python stocks/fetch_prices.py

      - name: Render page
        run: python stocks/render_page.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks/data/prices.json docs/index.html
          git diff --staged --quiet || git commit -m "Update stock prices $(date -u +%Y-%m-%d)"
          git push
